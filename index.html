<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Accesso</title>
</head>
<body>

<script>
  // Ora di Roma (Europe/Rome)
  const formatter = new Intl.DateTimeFormat("it-IT", {
    timeZone: "Europe/Rome",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });

  const parts = formatter.formatToParts(new Date());
  const ore = parts.find(p => p.type === "hour").value;
  const minuti = parts.find(p => p.type === "minute").value;

  const codiceValido = "comune" + ore + minuti;

  const inserito = prompt("Inserisci il codice di accesso:");

  if (inserito === codiceValido) {
    sessionStorage.setItem("accesso", "ok");
    window.location.href = "rubrica.html";
  } else {
    document.body.innerHTML = "<h2>Accesso negato</h2>";
  }
</script>

</body>
</html>

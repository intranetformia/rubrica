<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Accesso Rubrica</title>
</head>
<body>

<script>
  // Data/ora forzata su Europa/Rome
  const now = new Date(
    new Intl.DateTimeFormat("it-IT", {
      timeZone: "Europe/Rome",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }).formatToParts(new Date())
      .reduce((acc, p) => {
        if (p.type === "hour") acc.h = p.value;
        if (p.type === "minute") acc.m = p.value;
        return acc;
      }, {})
  );

  const ore = now.h;
  const minuti = now.m;

  const codiceValido = "comune" + ore + minuti;

  const inserito = prompt(
    "Inserisci il codice di accesso:"
  );

  if (inserito === codiceValido) {
    sessionStorage.setItem("accesso", "ok");
    window.location.href = "rubrica.html";
  } else {
    document.body.innerHTML =
      "<h2>Accesso negato</h2><p>Codice non valido.</p>";
  }
</script>

</body>
</html>
